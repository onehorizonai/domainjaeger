[package]
name = "domainjaeger"
version = "0.1.0"
edition = "2024"
description = "Hunts for available domain names made of real words: cook.ing, sn.app, mike.ai"
license = "MIT"
repository = "https://github.com/onehorizonai/domainjaeger"
homepage = "https://github.com/onehorizonai/domainjaeger"
readme = "README.md"
keywords = ["domain", "domains", "domain-hack", "cli", "wiktionary"]
categories = ["command-line-utilities"]
# Exports land next to where the tool is run: never part of the package.
exclude = ["/assets", "/.github", "/docs", "/dist-workspace.toml", "*.xlsx", "*.sqlite*"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
futures = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.99.1"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

# What the released binaries are built with (see docs/RELEASING.md).
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"

# Where `cargo binstall domainjaeger` finds a ready-made binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
